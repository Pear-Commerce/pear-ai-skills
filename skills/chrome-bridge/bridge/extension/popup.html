<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chrome Bridge</title>
    <style>
      body {
        font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
        width: 320px;
        margin: 0;
        padding: 14px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        margin: 8px 0 2px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #bbb;
        border-radius: 6px;
      }
      button {
        margin-top: 12px;
        padding: 7px 12px;
        border: 0;
        border-radius: 6px;
        background: #111827;
        color: #fff;
        cursor: pointer;
        width: 100%;
      }
      #status {
        margin-top: 10px;
        min-height: 16px;
        color: #065f46;
        white-space: pre-wrap;
      }
      .hint {
        margin-top: 10px;
        color: #6b7280;
        font-size: 12px;
      }
      code {
        background: #f3f4f6;
        padding: 1px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Chrome Bridge pairing</h1>
    <label for="token">Token</label>
    <input id="token" type="text" placeholder="paste token here" autocomplete="off" />
    <label for="port">Port</label>
    <input id="port" type="number" min="1" max="65535" value="8823" />
    <button id="save">Save &amp; connect</button>
    <div id="status"></div>
    <div class="hint">
      Get the token with <code>chrome-bridge token</code> (it lives in
      <code>~/.opencode-chrome-bridge/config.json</code>). The port must match the running host — plugin or daemon
      (default 8823).
    </div>
    <script src="popup.js"></script>
  </body>
</html>
