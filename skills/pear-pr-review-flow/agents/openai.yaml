interface:
  display_name: "Pear PR Review Flow"
  short_description: "Use PR worktrees, reviewers, Copilot, rebases, and green-PR landing"
  default_prompt: "Always use $pear-pr-review-flow when a PR is mentioned: run the Pear engineering cleanup gate before opening code PRs, isolate PR work, add reviewers/Copilot, handle feedback, rebase updated or out-of-date branches against latest base before debugging failed unit tests, never create branch-refresh merge commits, and watch Codex-authored PRs until they are green, approved, mergeable, and merged/closed."
