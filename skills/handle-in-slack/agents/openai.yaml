interface:
  display_name: "Handle in Slack"
  short_description: "Analyze Slack, gate actions, monitor follow-ups"
  default_prompt: "Use $handle-in-slack to analyze and handle this Slack message link. Do a comprehensive read-only sweep across all available relevant datasources before deciding the outcome. If read-only explanation is enough, post that without a YES/NO gate. Use a YES/NO approval gate before fixes, reruns, data changes, PRs, JSPs, or other side effects. After any substantive Slack reply, create or refresh a 48-hour follow-up monitor for the same thread."
